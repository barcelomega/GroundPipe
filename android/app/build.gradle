plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'dev.flutter.flutter-gradle-plugin'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.barcelomega.groundpipe"
    compileSdk 36
    ndkVersion "28.0.12674087"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    testOptions {
        // Buffer/timing tests use a fake stretch engine and don't need Android logging.
        unitTests.returnDefaultValues = true
    }

    sourceSets {
        main {
            java.srcDirs += 'src/main/kotlin'
            // The native library is built by externalNativeBuild below.
            // Ignore stale prebuilt copies in src/main/jniLibs.
            jniLibs.srcDirs = []
        }
    }

    defaultConfig {
        applicationId "com.barcelomega.groundpipe"
        minSdkVersion flutter.minSdkVersion
        targetSdk 36
        versionCode 6
        versionName "1.3.1"
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
                arguments "-DANDROID_STL=c++_shared"
            }
        }
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            signingConfig keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation "androidx.media3:media3-exoplayer:1.6.1"
    implementation "androidx.media3:media3-session:1.6.1"
    testImplementation "junit:junit:4.13.2"
}
